- id: installation_share
  label: Share of electrical and cooling cost that is installation work
  unit: share (0 to 1)
  low: 0.20
  central: 0.30
  high: 0.40
  source: Bank of America Global Research, Who makes the data center? (September 2024)
  note: >-
    Bank of America puts installation at USD 1.5 million per MW against USD
    1.7 million of electrical and 1.4 million of thermal equipment, so
    installation is 33% of the installed kit (29% if backup power is counted too).
