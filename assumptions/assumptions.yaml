# ---------------------------------------------------------------------------
# Lifecycle assumptions. Money is EUR at 2025 prices per MW of IT load. US
# dollar sources are converted at the 2025 average rate of 1.13 USD per EUR
# (Eurostat), Swiss francs at 0.937 CHF per EUR. Sources from other years are
# converted but not deflated; the error is a few percent, small next to the
# ranges. Where no public benchmark was found, the note says the value is an
# estimate.
