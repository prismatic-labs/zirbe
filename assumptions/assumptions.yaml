# Running the site

- id: it_load_factor.ai
  label: Average IT power use at an AI site, as a share of capacity
  unit: average IT electrical load over rated IT capacity (0 to 1)
  low: 0.40
  central: 0.70
  high: 0.85
  source: Epoch AI (2026); Lawrence Berkeley National Laboratory, 2024 United States Data Center Energy Usage Report (Shehabi et al.)
  url: https://epoch.ai/data-insights/ai-datacenter-cost-breakdown
  note: >-
    Average IT power over IT capacity. Epoch AI uses 71% this way for its AI
    case (capacity times PUE times hours gives its electricity bill), the
    average of four estimates. LBNL builds it up from the servers instead:
    busy at 70% of rated power, idle at 20%, busy 80% of the time for
    training and 40% for inference, which gives 60% and 40% of rated power.
    The low value covers that.
  source_accessed: "2026-11-11"
  source_published: "2026-05-14"
  status: approved

- id: it_load_factor.cloud
  label: Average IT power use at a cloud site, as a share of capacity
  unit: share (0 to 1)
  low: 0.45
  central: 0.65
  high: 0.75
  source: Lawrence Berkeley National Laboratory, 2024 United States Data Center Energy Usage Report (Shehabi et al.)
  url: https://eta-publications.lbl.gov/publications/2024-lbnl-data-center-energy-usage-report
  note: >-
    Average IT power over IT capacity. LBNL puts hyperscale servers busy
    about 50% of the time by 2027. Idle, they still draw 36% of their maximum
    power in 2023, falling to 27% by 2028, about 32% in 2025. Halfway between
    idle and maximum power gives about 66%.
  source_accessed: "2026-11-11"
  source_published: "2024-12"
  status: approved

