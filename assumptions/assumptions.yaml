# Heat recovery

- id: heat_recovery_share
  label: Share of IT energy delivered as heat to the network
  unit: share (0 to 1)
  low: 0.30
  central: 0.50
  high: 0.70
  source: Own estimate, no published benchmark found
  note: Heat networks take less heat in summer, so not all of the servers' heat can be delivered over a year. The range covers networks with weak and with strong summer demand.
  source_accessed: "2026-11-10"
  status: approved

- id: heat_pump_cop
  label: Heat delivered per unit of electricity used by the heat pumps
  unit: coefficient of performance
  low: 3.0
  central: 4.0
  high: 4.9
  source: Danish District Heating Association, Inspirational catalogue for large heat pumps
  url: https://danskfjernvarme.dk/media/lcgnphch/inspirational-catalogue-for-large-heat-pumps.pdf
  note: >-
    The Odense data centre heat pumps reach 4.4 and 4.9. Networks that need
    hotter water, such as Vienna's, get lower values.
  source_accessed: "2026-11-10"
  status: approved

- id: heat_pump_capex_per_mw_heat
  label: Cost of heat pumps, per MW of heat output
  unit: EUR per MW of heat output
  low: 500000
  central: 700000
  high: 1000000
  source: Zangeneh and Øi, Utilization of excess heat from data centers, University of South-Eastern Norway (2022)
  url: https://openarchive.usn.no/usn-xmlui/handle/11250/3009228
  note: >-
    A master's thesis case study (Rjukan, Norway) assumes EUR 0.7 million per
    MW of heat pump output. One case, so the range is wide. Heat pump output
    per MW of IT load equals the share of server heat captured, since the
    compressor electricity is already part of the facility load.
  source_accessed: "2026-11-10"
  source_published: "2022"
  status: approved

- id: heat_connection_capex_per_mw
  label: Cost of the connection to the heat network, per MW
  unit: EUR per MW of IT load
  low: 50000
  central: 150000
  high: 400000
  source: Own estimate, no published benchmark found
  note: The cost depends mostly on the distance to the network, so the range is wide.
  source_accessed: "2026-11-10"
  status: approved

- id: heat_recovery_upkeep_share
  label: Yearly upkeep of the heat recovery kit, as a share of its cost
  unit: share per year (0 to 1)
  low: 0.01
  central: 0.02
  high: 0.03
  source: Own estimate, no published benchmark found
  note: Set at a yearly rate typical for mechanical plant such as pumps and heat exchangers.
  source_accessed: "2026-11-10"
  status: approved

- id: heat_displaced_factor
  label: Carbon avoided per MWh of heat delivered to the network
  unit: kg CO2e per MWh of heat
  low: 100
  central: 224
  high: 250
  source: IPCC, 2006 Guidelines for National Greenhouse Gas Inventories, Volume 2, Chapter 2 (natural gas, 56.1 t CO2 per TJ)
  url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/vol2.html
  note: >-
    Central assumes the heat replaces a gas boiler of 90% efficiency. Low is
    an estimate for a network that already uses much waste heat or biomass.
  source_accessed: "2026-11-10"
  source_published: "2006"
  status: approved
