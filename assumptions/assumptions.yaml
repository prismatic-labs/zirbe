  central: 0.54
  high: 0.54
  source: Turner & Townsend, Data centre cost index 2025, as reported by ConstructConnect
  url: https://news.constructconnect.com/data-center-construction-input-costs-rise-significantly
  note: >-
    The index gives electrical 48 to 54%, mechanical 22 to 33%, core and shell
    9 to 14% and contractor fees 10% across air- and liquid-cooled sites. The
    ends add up to 100% only when paired: air-cooled 54, 22, 14 and 10;
    liquid-cooled 48, 33, 9 and 10. The shares are fixed by design, so they do
    not vary on their own.
  source_accessed: "2026-11-10"
  source_published: "2025"
  status: approved

