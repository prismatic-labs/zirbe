  source_accessed: "2026-11-10"
  status: approved

# IT equipment

- id: it_capex_per_mw.ai
  label: Cost of IT equipment for an AI site, per MW
  unit: EUR per MW of IT load
  low: 19670000
  central: 23110000
  high: 26550000
  source: Epoch AI, AI datacenter cost breakdown (Michael and Cottier, 2026)
  url: https://epoch.ai/data-insights/ai-datacenter-cost-breakdown
  note: >-
    Servers (USD 21.2 million per MW) plus network kit (USD 4.9 million per
    MW) in Epoch AI's 1 GW case. Published in May 2026 and not deflated to
    2025. The high value is Bank of America's estimate of USD 30 million per
    MW for IT equipment (September 2024). The low value sits as far below
    Epoch AI's figure as the high value sits above it.
  source_accessed: "2026-11-11"
  source_published: "2026-05-14"
  status: approved

- id: it_capex_per_mw.cloud
  label: Cost of IT equipment for a cloud site, per MW
  unit: EUR per MW of IT load
  low: 9110000
  central: 14530000
  high: 26550000
  source: Worked out from Bank of America Global Research, Who makes the data center? (September 2024), and Lawrence Berkeley National Laboratory, 2024 United States Data Center Energy Usage Report (Shehabi et al.)
  url: https://eta-publications.lbl.gov/publications/2024-lbnl-data-center-energy-usage-report
  note: >-
    Built up per MW. A conventional server draws about 673 W at full load in
    2025 (LBNL: 600 W in 2023, 782 W by 2028). Servers take 83% of IT power,
    storage 13% and network 4% (LBNL, 2023), so 1 MW holds about 1,233
    servers. Central uses the average server price in 2023, USD 11,167 (USD
    134 billion for about 12 million servers), and low the median, USD 7,000
    (Bank of America). Storage and network add 19.2% to the server cost (Bank of
    America). Converted at 0.885 euros per dollar. The average includes AI
    servers, so it leans high for a cloud site, while cloud servers are better
    equipped than the median one. The high value is Bank of America's USD 30
    million per MW, a market average that includes AI servers.
  source_accessed: "2026-11-11"
  status: approved

